<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Panel del Usuario</title>
        <link rel="stylesheet" href="estilos.css">
        <script src="scripts.js" defer></script>
    </head>
    <body>

        <!-- Barra superior -->
        <!-- Barra superior -->
        <div class="top-bar">
            <div class="dropdown">
                <button class="dropbtn" id="welcomeMessage">Bienvenido, Usuario</button>
                <div class="dropdown-content">
                    <a href="usuario.html">Mi perfil</a>
                    <a href="cursos.html">Mis cursos</a>
                    <a href="#">Configuración</a>
                    <a href="index.html" onclick="logout()">Cerrar sesión</a>
                </div>
            </div>
        </div>


        <!-- Perfil del usuario -->
        <section class="user-profile">
            <img src="imagenes/user-photo.jpg" alt="Foto de perfil" class="user-avatar">
            <h2 id="userNameDisplay">Usuario</h2>
            <p>Miembro desde: Enero 2025</p>
        </section>

        <!-- Progreso -->
        <section class="user-progress">
            <h3>Mi progreso</h3>
            <div class="progress-bar">
                <div class="progress" style="width: 60%;">60%</div>
            </div>
        </section>

        <!-- Cursos inscritos -->
        <section class="user-courses">
            <h3>Mis cursos</h3>
            <div class="course-list">
                <article class="course-card">
                    <h4>Curso de Excel Básico</h4>
                    <p>Progreso: 80%</p>
                    <button onclick="window.location.href='cursoexcel.html'">Continuar</button>
                </article>

                <article class="course-card">
                    <h4>Curso de Word Básico</h4>
                    <p>Progreso: 40%</p>    
                    <button onclick="window.location.href='cursoword.html'">Continuar</button>
                </article>
            </div>
        </section>
        <!-- Bloque de formulario de usabilidad -->
        <section class="usability-test" style="margin: 50px auto; text-align: center;">
            <h2>Prueba de Usabilidad</h2>
            <p>Ayúdanos a mejorar respondiendo este formulario:</p>
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScc-CbX9BghFyCOx2CwjJrb8PLZ1Q9I-AM77A8iG7WN9zdZ1g/viewform?usp=preview" 
                    width="640" height="800" frameborder="0" marginheight="0" marginwidth="0">
                Cargando…
            </iframe>
        </section>


    </body>
</html>
