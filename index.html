<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Logotipo -->
  <div class="corner-logo">
    <img src="imagenes/logo.proyecto.jpg" alt="Logotipo Plataforma E-learning">
  </div>

  <!-- Contenedor de login -->
  <div class="login-container">
    <div class="login-box">
      <h2>Iniciar Sesión</h2>
      <input type="text" id="userName" placeholder="Nombre de usuario" required>
      <input type="email" id="email" placeholder="Correo electrónico" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button onclick="login()">Entrar</button>
    </div>
  </div>

  <!-- 🔹 Nuevo bloque para el formulario de HubSpot -->
  <div class="hubspot-form" style="margin: 50px auto; width: 400px; text-align: center;">
    <h2>Formulario de Contacto</h2>
    <script charset="utf-8" type="text/javascript" src="//js.hsforms.net/forms/embed/v2.js"></script>
    <script>
      hbspt.forms.create({
        region: "na1",
        portalId: "50395961",
        formId: "f59762d4-9439-4e30-8902-2fc78b0d28ec"
      });
    </script>
  </div>

</body>
</html>
